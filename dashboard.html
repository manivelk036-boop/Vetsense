<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetSense AI — Dashboard</title>
  <meta name="description" content="VetSense AI Dashboard - Real-time bovine mastitis risk monitoring and AI forecasting.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">🐄</div>
      <div class="brand-text">
        <div class="brand-name">VetSense AI</div>
        <div class="brand-tagline">Intelligence Before Illness</div>
      </div>
    </div>
    <div class="sidebar-user" id="sidebarUser">
      <div class="user-avatar" id="userAvatar" style="background:var(--teal);">RK</div>
      <div class="user-info">
        <div class="user-name" id="userName">Rajkumar M.</div>
        <div class="user-role" id="userRole">Dairy Farmer</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- dynamically built -->
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-footer-btn lang-active" id="langBtn" onclick="App.toggleLang()">🌐 EN / தமிழ்</button>
      <button class="sidebar-footer-btn" onclick="App.logout()">🚪 Logout</button>
    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.closeSidebar()"></div>

  <!-- Main -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="topbar-hamburger" onclick="App.openSidebar()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div style="flex:1">
        <div class="topbar-title" id="topbarTitle">Dashboard Overview</div>
        <span class="topbar-subtitle" id="topbarSub">Kaveri Dairy Farm · Tamil Nadu</span>
      </div>
      <div class="topbar-actions">
        <div class="iot-status" id="iotStatusBar">
          <div class="pulse-dot"></div>
          <span>IoT Live</span>
        </div>
        <div class="topbar-ai-confidence" id="aiConfBar">
          🤖 <span>AI: 87% Conf.</span>
        </div>
        <button class="topbar-notif-btn" onclick="App.navigate('alerts')" title="Alerts">
          🔔
          <span class="notif-count" id="notifCount">2</span>
        </button>
      </div>
    </header>

    <main class="main-content fade-in" id="mainContent">
      <div class="empty-state">
        <div class="es-icon">🔄</div>
        <p>Loading dashboard...</p>
      </div>
    </main>
  </div>
</div>

<!-- Scripts in dependency order -->
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/cows.js"></script>
<script src="js/views/iot.js"></script>
<script src="js/views/farmdata.js"></script>
<script src="js/views/vet.js"></script>
<script src="js/views/lab.js"></script>
<script src="js/views/ai.js"></script>
<script src="js/views/alerts.js"></script>
<script src="js/views/analytics.js"></script>
<script src="js/views/recommendations.js"></script>
<script src="js/views/historical.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
