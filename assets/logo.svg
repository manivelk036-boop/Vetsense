  <path d="M36 38 C34 33 29 32 27 34 C25 36 28 41 33 42 C32 46 32 50 33 54 C34 60 41 68 50 68 C59 68 66 60 67 54 C68 50 68 46 67 42 C72 41 75 36 73 34 C71 32 66 33 64 38 C60 35 40 35 36 38 Z" fill="#ffffff" fill-opacity="0.95"/>
