  </defs>
  <!-- Background Rounded Hex / Shield -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#grad)"/>
  <!-- Inner Subtle Shield -->
  <path d="M50 22 L72 32 V52 C72 65 62 76 50 80 C38 76 28 65 28 52 V32 Z" fill="#060d1a" fill-opacity="0.25"/>
