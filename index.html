<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetSense AI — Sign In</title>
  <meta name="description" content="VetSense AI - AI-powered IoT predictive system for early bovine mastitis forecasting in Indian dairy farms.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden; }
    .login-bg { position:fixed; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(20,184,166,0.12) 0%,transparent 60%), radial-gradient(ellipse 60% 80% at 80% 80%,rgba(14,165,233,0.08) 0%,transparent 60%), var(--bg-900); }
    .login-grid { position:fixed; inset:0; background-image:linear-gradient(rgba(20,184,166,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(20,184,166,0.04) 1px,transparent 1px); background-size:60px 60px; }
    .login-card { position:relative; z-index:10; width:100%; max-width:440px; background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius-xl); padding:40px; box-shadow:0 24px 80px rgba(0,0,0,0.7); animation:slideUp 0.5s ease; }
    .login-brand { text-align:center; margin-bottom:32px; }
    .login-logo { width:64px; height:64px; border-radius:16px; background:linear-gradient(135deg,var(--teal),var(--primary)); display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 14px; box-shadow:0 8px 32px rgba(20,184,166,0.4); animation:float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .login-app-name { font-family:var(--font-display); font-size:1.75rem; font-weight:700; background:linear-gradient(135deg,var(--teal),var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .login-tagline { font-size:0.78rem; color:var(--text-400); font-style:italic; margin-top:4px; }
    .role-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:24px; }
    .role-tab { padding:10px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; color:var(--text-300); font-size:0.78rem; font-weight:600; cursor:pointer; transition:all var(--transition); text-align:center; font-family:var(--font-body); display:flex; flex-direction:column; align-items:center; gap:4px; }
    .role-tab .role-emoji { font-size:1.2rem; }
    .role-tab:hover { border-color:var(--border-light); color:var(--text-100); }
    .role-tab.active { background:var(--primary-glow); border-color:var(--primary); color:var(--primary); }
    .demo-box { background:var(--bg-700); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:20px; font-size:0.78rem; color:var(--text-300); }
    .demo-cred { display:flex; justify-content:space-between; margin-top:4px; }
    .demo-cred span { color:var(--accent); font-weight:600; font-family:monospace; }
    .login-error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:var(--radius-sm); padding:10px 14px; font-size:0.82rem; color:#fca5a5; margin-bottom:14px; display:none; }
    .login-footer { text-align:center; margin-top:20px; font-size:0.72rem; color:var(--text-muted); }
    .particles { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
    .particle { position:absolute; width:2px; height:2px; background:var(--teal); border-radius:50%; opacity:0.4; animation:rise linear infinite; }
    @keyframes rise { 0%{transform:translateY(100vh) scale(0);opacity:0;} 20%{opacity:0.4;} 80%{opacity:0.4;} 100%{transform:translateY(-20px) scale(1);opacity:0;} }
  </style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="particles" id="particles"></div>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">🐄</div>
        <div class="login-app-name">VetSense AI</div>
        <div class="login-tagline">Intelligence Before Illness</div>
      </div>
      <div class="role-tabs" id="roleTabs">
        <button class="role-tab active" data-role="farmer" onclick="selectRole('farmer',this)"><span class="role-emoji">👨‍🌾</span>Farmer</button>
        <button class="role-tab" data-role="vet" onclick="selectRole('vet',this)"><span class="role-emoji">🩺</span>Veterinarian</button>
        <button class="role-tab" data-role="admin" onclick="selectRole('admin',this)"><span class="role-emoji">⚙️</span>Admin</button>
      </div>
      <div class="demo-box" id="demoBox">
        <strong style="color:var(--text-200)">Demo Credentials:</strong>
        <div class="demo-cred">Username: <span id="demoUser">rajkumar</span> &nbsp; Password: <span id="demoPass">farm123</span></div>
      </div>
      <div class="login-error" id="loginError">Invalid username or password. Please try again.</div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" class="form-control" type="text" placeholder="Enter your username" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" class="form-control" type="password" placeholder="Enter your password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-teal btn-block btn-lg" id="loginBtn">
          <span>Sign In to Dashboard</span>
        </button>
      </form>
      <div class="login-footer">VetSense AI v2.0 · Kaveri Dairy Farm · Tamil Nadu, India</div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script>
    const demoCreds = {farmer:{u:'rajkumar',p:'farm123'},vet:{u:'drvenkat',p:'vet456'},admin:{u:'admin',p:'admin789'}};
    let selectedRole = 'farmer';
    function selectRole(role,el){
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
      const c = demoCreds[role];
      document.getElementById('demoUser').textContent = c.u;
      document.getElementById('demoPass').textContent = c.p;
      document.getElementById('username').value = c.u;
      document.getElementById('password').value = c.p;
      document.getElementById('loginError').style.display='none';
    }
    function handleLogin(e){
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Signing in...';
      setTimeout(()=>{
        const user = VetData.users.find(x=>x.username===u && x.password===p);
        if(user){
          sessionStorage.setItem('vetsense_user', JSON.stringify(user));
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('loginError').style.display='block';
          btn.disabled = false; btn.innerHTML = '<span>Sign In to Dashboard</span>';
        }
      }, 800);
    }
    // particles
    const pc = document.getElementById('particles');
    for(let i=0;i<20;i++){
      const p=document.createElement('div'); p.className='particle';
      p.style.cssText=`left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*8}s;width:${1+Math.random()*3}px;height:${1+Math.random()*3}px;`;
      pc.appendChild(p);
    }
    // Pre-fill default farmer credentials on initial load
    document.getElementById('username').value = 'rajkumar';
    document.getElementById('password').value = 'farm123';
    const sess = sessionStorage.getItem('vetsense_user');
    if(sess){
      const u=JSON.parse(sess);
      document.getElementById('username').value=u.username;
      if(u.password) document.getElementById('password').value=u.password;
    }
  </script>
</body>
</html>
